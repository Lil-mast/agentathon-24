<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" role="img" aria-label="Nairobi Budget Agent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B2412"/>
      <stop offset="1" stop-color="#6B3F1D"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1C57A"/>
      <stop offset="1" stop-color="#D08A3C"/>
    </linearGradient>
  </defs>

  <rect width="480" height="160" rx="20" fill="url(#bg)"/>

  <!-- mark: stacked bars + speech tail -->
  <g transform="translate(28,30)">
    <rect x="0" y="60" width="80" height="20" rx="4" fill="url(#bar)" opacity="0.55"/>
    <rect x="0" y="36" width="56" height="20" rx="4" fill="url(#bar)" opacity="0.78"/>
    <rect x="0" y="12" width="36" height="20" rx="4" fill="url(#bar)"/>
    <path d="M84 86 L100 100 L92 86 Z" fill="url(#bar)"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(160,0)" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" fill="#F7E7CE">
    <text x="0" y="78" font-size="44" font-weight="700" letter-spacing="-1">Nairobi Budget</text>
    <text x="2" y="112" font-size="18" font-weight="500" opacity="0.78" letter-spacing="1.5">CITIZEN  ·  AGENT  ·  TRANSPARENCY</text>
  </g>
</svg>
